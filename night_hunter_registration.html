<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>Night Hunter Official | Registration</title>
<style>
:root{--red:#ff3158;--gold:#ffc857;--bg:#080a11;--panel:rgba(18,22,34,.88);--muted:#aab0c2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 15% 10%,#321128 0,transparent 34%),radial-gradient(circle at 90% 80%,#102d48 0,transparent 35%),var(--bg);overflow-x:hidden;display:grid;place-items:center;padding:28px 14px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 45%,rgba(255,49,88,.05) 50%,transparent 55%);background-size:220% 100%;animation:scan 7s linear infinite}
@keyframes scan{to{background-position:-220% 0}} 
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes glow{0%,100%{box-shadow:0 0 18px #ff315833,0 0 40px #ff315811}50%{box-shadow:0 0 28px #ff315866,0 0 65px #ff315822}}
@keyframes reveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.card{position:relative;width:min(100%,570px);padding:clamp(23px,5vw,42px);border:1px solid #ff315855;border-radius:24px;background:var(--panel);backdrop-filter:blur(16px);animation:reveal .8s ease both,glow 4s ease-in-out infinite;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--red),var(--gold),transparent)}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;font-size:35px;background:linear-gradient(135deg,#ff3158,#7b163e);box-shadow:0 0 28px #ff315855;animation:float 4s ease-in-out infinite}
header{text-align:center}
.kicker{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:800}
h1{font-size:clamp(28px,7vw,40px);letter-spacing:1px;margin:10px 0 8px;text-transform:uppercase}
h1 span{color:var(--red);text-shadow:0 0 18px #ff315866}
.subtitle{color:var(--muted);line-height:1.5;margin:0 0 26px;font-size:14px}
fieldset{border:0;padding:0;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.7px;margin:0 0 8px;color:#e8eaf2}
input,select,textarea{width:100%;border:1px solid #34394b;border-radius:11px;padding:13px 14px;color:#fff;background:#0b0e18;font:inherit;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #ff31581f}
input::placeholder,textarea::placeholder{color:#737b90}
select{color:#cbd0df} select option{background:#0b0e18}
textarea{resize:vertical;min-height:82px}
.check{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:12px;line-height:1.5;margin:2px 0 18px}
.check input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--red);flex:none}
button{width:100%;border:0;border-radius:12px;padding:15px 18px;background:linear-gradient(100deg,var(--red),#ff6b4a);color:#fff;font-weight:900;letter-spacing:1.6px;cursor:pointer;transition:transform .2s,filter .2s;box-shadow:0 8px 25px #ff315833}
button:hover{transform:translateY(-2px);filter:brightness(1.12)}button:active{transform:scale(.99)}
#message{display:none;margin-top:16px;padding:13px;border:1px solid #2fd49a66;background:#12372d;color:#9ff2d1;border-radius:10px;font-size:13px;line-height:1.5}
footer{text-align:center;color:#737b90;font-size:11px;margin-top:22px;line-height:1.6}
@media(max-width:460px){.grid{grid-template-columns:1fr;gap:0}.card{padding:24px 19px}.logo{width:66px;height:66px}}
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="logo" aria-hidden="true">☾</div>
    <div class="kicker">ENTER THE NIGHT</div>
    <h1>NIGHT <span>HUNTER</span></h1>
    <p class="subtitle">OFFICIAL REGISTRATION APPLICATION<br>Join the squad. Prove your skill. Hunt for victory.</p>
  </header>

  <form id="registrationForm">
    <fieldset>
      <div class="grid">
        <div class="field"><label for="ign">GAMER NAME / IGN *</label><input id="ign" name="ign" placeholder="Your in-game name" required maxlength="40"></div>
        <div class="field"><label for="realname">FULL NAME *</label><input id="realname" name="realname" placeholder="Your full name" required maxlength="80"></div>
      </div>
      <div class="grid">
        <div class="field"><label for="gameid">PLAYER ID *</label><input id="gameid" name="gameid" placeholder="Enter your player ID" required maxlength="40"></div>
        <div class="field"><label for="role">PREFERRED ROLE *</label><select id="role" name="role" required><option value="" disabled selected>Select role</option><option>Rusher</option><option>Sniper</option><option>Support</option><option>IGL / Leader</option><option>Flex</option></select></div>
      </div>
      <div class="grid">
        <div class="field"><label for="age">AGE *</label><input id="age" name="age" type="number" min="13" max="99" placeholder="Your age" required></div>
        <div class="field"><label for="contact">CONTACT / SOCIAL *</label><input id="contact" name="contact" placeholder="Messenger or Discord" required maxlength="100"></div>
      </div>
      <div class="field"><label for="experience">SCRIMMAGE EXPERIENCE</label><select id="experience" name="experience"><option>Beginner</option><option>Intermediate</option><option>Experienced</option><option>Competitive player</option></select></div>
      <div class="field"><label for="reason">WHY DO YOU WANT TO JOIN?</label><textarea id="reason" name="reason" placeholder="Tell us a little about yourself (optional)" maxlength="500"></textarea></div>
      <label class="check"><input type="checkbox" required><span>I confirm that the information above is accurate and agree to follow Night Hunter Official's team rules.</span></label>
      <button type="submit">SUBMIT APPLICATION &nbsp; ↗</button>
      <div id="message" role="status"></div>
    </fieldset>
  </form>
  <footer>☾ NIGHT HUNTER OFFICIAL · REGISTRATION PORTAL<br>Designed for the squad. Stay sharp. Hunt together.</footer>
</main>
<script>
document.getElementById('registrationForm').addEventListener('submit', function(event){
  event.preventDefault();
  const name = document.getElementById('ign').value.trim();
  const message = document.getElementById('message');
  message.style.display = 'block';
  message.textContent = 'Application preview complete, ' + name + '! This demo form does not send or save your details yet. Connect it to a form service or backend before sharing it for real registrations.';
  message.scrollIntoView({behavior:'smooth',block:'nearest'});
});
</script>
</body>
</html>
